name: Build Debian package

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:13

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            debhelper \
            cmake \
            qt6-base-dev \
            git

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch development branches
        run: |
          git fetch origin main
          git fetch origin develop
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          git show-ref --verify --quiet refs/heads/develop || git branch develop origin/develop

      - name: Build package
        run: ./scripts/build-deb.sh

      - name: Show Debian changelog
        run: cat debian/changelog

      - name: Show package
        run: ls -lh ../*.deb
